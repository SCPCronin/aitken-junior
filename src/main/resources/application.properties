# =============================================================================
# APPLICATION PROPERTIES ? shared across all environments
# Environment-specific overrides live in application-{profile}.properties
# Active profile is set via: -Dspring.profiles.active=dev (or env var SPRING_PROFILES_ACTIVE)
# =============================================================================

# Application identity ? used by Spring Boot Actuator's /actuator/info endpoint
spring.application.name=AitkenJunior
app.version=1.0.0-SNAPSHOT

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
# Default port. Can be overridden per-environment.
server.port=8080

# Contextual path prefix for all endpoints ? keeps API routes clean and versioned
server.servlet.context-path=/

# =============================================================================
# SPRING BOOT ACTUATOR
# Actuator exposes operational endpoints (health, metrics, info).
# In production, these should be secured or bound to a management port.
# =============================================================================
# Expose the health and info endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics
# Show full health details (useful for Docker health checks)
management.endpoint.health.show-details=always
# Include database, disk space, and ping in the health check
management.health.defaults.enabled=true

# =============================================================================
# JSON SERIALISATION (Jackson)
# =============================================================================
# Do not serialise properties with null values ? keeps API responses clean
spring.jackson.default-property-inclusion=non_null
# Format dates as ISO-8601 strings rather than timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================================================
# DISCORD BOT CONFIGURATION
# The actual token must NEVER be committed to source control.
# Set it via: environment variable DISCORD_BOT_TOKEN, or in application-dev.properties (gitignored).
# See: https://discord.com/developers/applications
# =============================================================================
discord.bot.token=${DISCORD_BOT_TOKEN:disabled}
# Set to false to disable the bot entirely (useful in test environments)
discord.bot.enabled=false

# =============================================================================
# LOGGING
# Logback configuration is in logback-spring.xml for structured/profile-aware logging.
# Adjust levels here for quick changes without touching XML.
# =============================================================================
logging.level.org.example=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

