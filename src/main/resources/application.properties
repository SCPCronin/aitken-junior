spring.application.name=aitken-junior

logging.pattern.level=%d{yyyy-MM-dd-HH:mm:ss} - [%X{correlationId}] - %5p - %msg

# Postgresql
spring.datasource.url=jdbc:postgresql://localhost:31971/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword 
# Set up Password Rotation, this is only a temporary solution whilst my container is running during development

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

logging.level.org.springframework.jdbc.core=DEBUG
