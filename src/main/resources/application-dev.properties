# =============================================================================
# DEV PROFILE PROPERTIES
# Activated with: -Dspring.profiles.active=dev
# These settings are for local development with the Docker Compose stack.
#
# IMPORTANT: This file should NOT contain real secrets. Add it to .gitignore
# if you put real credentials here. Prefer using a .env file with Docker Compose
# and exporting env vars to the shell before running the app locally.
# =============================================================================

# =============================================================================
# DATABASE ? points at the local Docker Compose Postgres container
# The credentials match those set in docker-compose.yml
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aitken_junior_db
spring.datasource.username=aitken_user
spring.datasource.password=aitken_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP is the default pool in Spring Boot)
# Keep the pool small for local dev to avoid overwhelming a single container
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
# 'validate' confirms the schema matches entity definitions without modifying it.
# Flyway owns schema changes ? never use 'update' or 'create' in real environments.
spring.jpa.hibernate.ddl-auto=validate
# Print SQL to the console ? very useful for debugging locally
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Postgres dialect ? tells Hibernate to generate Postgres-compatible SQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# FLYWAY
# =============================================================================
# Flyway is enabled and will run migrations on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Baseline allows Flyway to manage a database that already has tables
spring.flyway.baseline-on-migrate=false

# =============================================================================
# DISCORD BOT ? local dev token
# Replace this placeholder with your actual bot token for local development.
# NEVER commit a real token to git.
# Get your token from: https://discord.com/developers/applications
# =============================================================================
discord.bot.token=${DISCORD_BOT_TOKEN:your-discord-bot-token-here}
discord.bot.enabled=false

# =============================================================================
# LOGGING ? more verbose in dev
# =============================================================================
logging.level.org.example=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# =============================================================================
# ACTUATOR ? expose all endpoints in dev for debugging
# =============================================================================
management.endpoints.web.exposure.include=*

