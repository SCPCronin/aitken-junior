# =============================================================================
# TEST PROFILE PROPERTIES
# Activated automatically by @SpringBootTest when spring.profiles.active=test
# or by setting the active profile in test classes.
#
# Uses H2 in-memory database ? no Docker or external services needed for tests.
# This keeps the test suite fast and self-contained.
# =============================================================================

# =============================================================================
# DATABASE ? H2 in-memory, resets on every test run
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
# 'create-drop' creates the schema at test startup and drops it after ? no Flyway needed
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================================================
# FLYWAY ? disabled in tests; Hibernate manages schema via create-drop
# =============================================================================
spring.flyway.enabled=false

# =============================================================================
# DISCORD BOT ? disabled in tests
# =============================================================================
discord.bot.enabled=false
discord.bot.token=test-token

# =============================================================================
# LOGGING ? minimal noise during test runs
# =============================================================================
logging.level.org.example=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

